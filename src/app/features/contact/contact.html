<!-- overflow-x-clip keeps the decorative accent circle from creating a horizontal scrollbar -->
<div class="h-[80vh] mt-18 flex flex-col justify-center items-center overflow-x-clip">

    <section class="relative mt-10">
        <img src="/images/astro.png" alt="" aria-hidden="true"
            class="w-40 lg:w-50 absolute -top-50 -left-10 lg:-top-40 lg:-left-70" />
        <div class="space-y-5">
            <div class="flex items-center gap-3">
                <img src="/images/email.svg" alt="" aria-hidden="true" class="w-8" />
                <a [href]="'mailto:' + profile.email"
                    class="text-highlight-text font-anton text-xl lg:text-2xl hover:text-accent transition-colors duration-200">{{ profile.email }}</a>
            </div>
            <div class="flex items-center gap-3">
                <img src="/images/mobile.svg" alt="" aria-hidden="true" class="w-8" />
                <a [href]="'tel:' + profile.phone.replace(/[^+0-9]/g, '')"
                    class="text-highlight-text font-anton text-xl lg:text-2xl hover:text-accent transition-colors duration-200">{{ profile.phone }}</a>
            </div>
            <div class="flex items-center gap-3">
                <img src="/images/location.svg" alt="" aria-hidden="true" class="w-8" />
                <p class="text-highlight-text font-anton text-xl lg:text-2xl">{{ profile.location }}</p>
            </div>
        </div>

        <p class="mt-6 text-sm">{{ profile.availability }}</p>
        <p class="text-sm">{{ profile.workAuth }}</p>

        <div class="mt-10 space-y-5">
            <p class="text-lg text-center">Also Find Me On</p>
            <div class="flex justify-center items-center gap-10">
                <a [href]="profile.links.github" target="_blank" rel="noopener noreferrer"
                    aria-label="GitHub profile" class="hover:-translate-y-1 transition-all duration-200"><img
                        src="/images/github.svg" alt="" aria-hidden="true" class="w-10 lg:w-12" /></a>
                <a [href]="profile.links.linkedin" target="_blank" rel="noopener noreferrer"
                    aria-label="LinkedIn profile" class="hover:-translate-y-1 transition-all duration-200"><img
                        src="/images/linkedin.svg" alt="" aria-hidden="true" class="w-10 lg:w-12" /></a>
                <a [href]="profile.links.x" target="_blank" rel="noopener noreferrer" aria-label="X profile"
                    class="hover:-translate-y-1 transition-all duration-200"><img src="/images/x.svg" alt=""
                        aria-hidden="true" class="w-10 lg:w-12" /></a>
            </div>
        </div>
    </section>

    <div aria-hidden="true"
        class="fixed -bottom-950 -right-600 lg:-bottom-930 lg:-right-580 w-[4000px] h-[4000px] bg-accent rounded-full opacity-40">
    </div>
</div>
